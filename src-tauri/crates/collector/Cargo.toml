[package]
name = "activity-collector"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
activity-core = { path = "../core" }
# consumer 把 Event 交给 BatchWriter（spec §3 的 Event Bus 那一层），
# 所以 collector 依赖 storage。storage 不反向依赖 collector，无环。
activity-storage = { path = "../storage" }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
activity-core = { path = "../core" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_SystemInformation"] }
