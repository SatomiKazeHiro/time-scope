[workspace]
members = ["crates/core", "crates/storage", "crates/collector", "crates/engine", "."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 本 crate 即 workspace 根，也是最终的 Tauri 应用。
[package]
name = "time-scope"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows 本地个人时间账本"
default-run = "time-scope"

[lib]
name = "time_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.1", features = [] }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["local-offset", "parsing", "formatting", "macros"] }
activity-core = { path = "crates/core" }
activity-storage = { path = "crates/storage" }
activity-collector = { path = "crates/collector" }
activity-engine = { path = "crates/engine" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
