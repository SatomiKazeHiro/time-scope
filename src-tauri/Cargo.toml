[workspace]
members = ["crates/core", "crates/storage", "crates/collector", "crates/engine", "."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# 本 crate 即 workspace 根，也是最终的 Tauri 应用。
[package]
name = "time-scope"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows 本地个人时间账本"
default-run = "time-scope"

[lib]
name = "time_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
# spec §12：单实例。不加它第二个进程会同时写同一个 SQLite，实测会崩在 WebView2
tauri-plugin-single-instance = "2"
# spec §4.3：开机自启，默认关，由用户在托盘菜单里主动打开
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
regex = "1.11"
toml = "0.8"
time = { version = "0.3", features = ["local-offset", "parsing", "formatting", "macros"] }
activity-core = { path = "crates/core" }
activity-storage = { path = "crates/storage" }
activity-collector = { path = "crates/collector" }
activity-engine = { path = "crates/engine" }
rusqlite.workspace = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# 关窗确认框用原生 MessageBoxW：Tauri 2 没有内置对话框，
# 为一个模态确认框引入 dialog 插件不划算（spec §4.2）
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]
